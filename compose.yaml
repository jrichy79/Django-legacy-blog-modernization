services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PGDATABASE: blog
      PGUSER: blog
      PGPASSWORD: devpassword
      PGHOST: db
      PGPORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata: